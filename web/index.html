<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Schwammhirn</title>
<style>
  :root { color-scheme: dark; --bg: #1a1a14; --fg: #f2e9c9; --dim: #8a8468; --yel: #f0c419; --card: #26251c; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 16px; font: 15px/1.4 system-ui, sans-serif; background: var(--bg); color: var(--fg); max-width: 720px; margin-inline: auto; }
  h1 { font-size: 1.3rem; margin: 0 0 12px; display: flex; align-items: center; gap: 12px; }
  h1 small { color: var(--dim); font-weight: normal; font-size: .85rem; }
  .card { background: var(--card); border-radius: 12px; padding: 12px; margin-bottom: 12px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  button { font: inherit; padding: 8px 14px; border-radius: 8px; border: 1px solid #444; background: #333; color: var(--fg); cursor: pointer; }
  button:hover { background: #3d3d3d; }
  button.active { background: var(--yel); color: #111; border-color: var(--yel); }
  button:disabled { opacity: .4; cursor: default; }
  input[type=text] { font: inherit; flex: 1; min-width: 120px; padding: 8px; border-radius: 8px; border: 1px solid #444; background: #111; color: var(--fg); }
  input[type=range] { flex: 1; min-width: 120px; accent-color: var(--yel); }
  label { display: flex; align-items: center; gap: 10px; margin: 6px 0; }
  label span.val { width: 3ch; text-align: right; color: var(--dim); font-variant-numeric: tabular-nums; }
  canvas { width: 100%; touch-action: none; border-radius: 12px; display: block; }
  #log { font: 12px/1.4 ui-monospace, monospace; color: var(--dim); max-height: 120px; overflow-y: auto; white-space: pre-wrap; margin: 0; }
  .hint { color: var(--dim); font-size: .85rem; }
</style>
</head>
<body>
<h1>🧠 Schwammhirn <small id="state">Simulation</small></h1>

<div class="card row">
  <button id="connect">Mit Badge verbinden</button>
  <button id="pulse">⚡ Puls</button>
  <button id="status" disabled>Status</button>
  <span class="hint" id="peers"></span>
</div>

<div class="card">
  <div class="row" id="modes">
    <button data-mode="neurons">Neuronen</button>
    <button data-mode="pulse">Wellen</button>
    <button data-mode="text">Laufschrift</button>
    <button data-mode="remote">Malen</button>
  </div>
  <div class="row" style="margin-top:10px">
    <input type="text" id="text" maxlength="63" placeholder="Laufschrift…" value="SCHWAMMHIRN">
    <button id="sendText">Senden</button>
  </div>
  <label>Tempo <input type="range" id="speed" min="0" max="100" value="50"><span class="val" id="speedVal">50</span></label>
  <label>Helligkeit <input type="range" id="bright" min="1" max="15" value="15"><span class="val" id="brightVal">15</span></label>
  <label>Schriftgröße <input type="range" id="tsize" min="1" max="5" value="3"><span class="val" id="tsizeVal">3</span></label>
  <label>Abstand oben <input type="range" id="ty" min="0" max="30" value="6"><span class="val" id="tyVal">6</span></label>
  <label><input type="checkbox" id="sync" checked> Mit anderen Badges synchronisieren</label>
</div>

<div class="card">
  <canvas id="brain" width="900"></canvas>
  <div class="row" style="margin-top:8px">
    <span class="hint" id="canvasHint"></span>
    <button id="clear" hidden>Löschen</button>
    <button id="invert" hidden>Invertieren</button>
  </div>
</div>

<div class="card"><pre id="log"></pre></div>
<p class="hint">Ohne Verbindung läuft hier dieselbe Animation wie auf dem Badge als Simulation. Web Bluetooth läuft in Chrome/Edge auf Android, Windows, macOS und Linux. Auf dem iPhone braucht es den Browser „Bluefy“.</p>

<script src="led_map.js"></script>
<script>
const SERVICE = '6e400001-b5a3-f393-e0a9-e50e24dcca9e';
const RX = '6e400002-b5a3-f393-e0a9-e50e24dcca9e';
const TX = '6e400003-b5a3-f393-e0a9-e50e24dcca9e';
const N = LED_XY.length;

const $ = id => document.getElementById(id);
const log = s => { const el = $('log'); el.textContent += s + '\n'; el.scrollTop = el.scrollHeight; };

// --- Zustand (spiegelt struct State der Firmware) ---------------------------
const st = { mode: 'neurons', speed: 50, bright: 15, text: 'SCHWAMMHIRN', tsize: 3, ty: 6 };
let frame = new Uint8Array(N);       // was angezeigt wird (Simulation, Mirror oder gemaltes Bild)
let painted = new Uint8Array(N);     // Bild im Modus "Malen"
let painting = false;
let rx = null, device = null, connected = false;

// --- Simulation: 1:1-Port der Firmware-Animationen --------------------------
const CW = 48, CH = 40;
const canvas = new Uint8Array(CW * CH);
const epoch = performance.now();
const animTime = () => performance.now() - epoch;
const waves = [];

function canvasSet(x, y, v) {
  if (x < 0 || y < 0 || x >= CW || y >= CH) return;
  const i = y * CW + x;
  if (v > canvas[i]) canvas[i] = v;
}
function sampleCanvas(radius) {
  for (let i = 0; i < N; i++) {
    const cx = (LED_XY[i][0] * CW) >> 8, cy = (LED_XY[i][1] * CH) >> 8;
    let m = 0;
    for (let dy = -radius; dy <= radius; dy++) for (let dx = -radius; dx <= radius; dx++) {
      const x = cx + dx, y = cy + dy;
      if (x >= 0 && y >= 0 && x < CW && y < CH) m = Math.max(m, canvas[y * CW + x]);
    }
    frame[i] = m;
  }
}
function triggerWave(origin) {
  if (waves.length >= 4) waves.shift();
  waves.push({ start: performance.now(), origin });
}
function renderWaves() {
  const now = performance.now();
  for (let k = waves.length - 1; k >= 0; k--) {
    const w = waves[k], age = now - w.start;
    if (age > 1800) { waves.splice(k, 1); continue; }
    const r = age * 0.25, fade = 1 - age / 1800, [ox, oy] = LED_XY[w.origin];
    for (let i = 0; i < N; i++) {
      const d = Math.hypot(LED_XY[i][0] - ox, LED_XY[i][1] - oy);
      const kk = 1 - Math.abs(d - r) / 30;
      if (kk <= 0) continue;
      frame[i] = Math.max(frame[i], 255 * kk * fade);
    }
  }
}
function renderNeurons(dt) {
  const decay = 2 + (dt >> 2);
  for (let i = 0; i < N; i++) frame[i] = frame[i] > decay ? frame[i] - decay : 0;
  const flashes = 1 + Math.floor(st.speed / 25);
  for (let n = 0; n < flashes; n++) if (Math.random() * 100 < 20 + st.speed / 2) frame[(Math.random() * N) | 0] = 255;
}
let nextPulseAt = 0;
function renderPulseMode(t) {
  frame.fill(0);
  if (performance.now() >= nextPulseAt) {
    triggerWave(Math.floor(t / 100) % N);
    nextPulseAt = performance.now() + 2500 - st.speed * 20;
  }
}
function renderText(t) {
  canvas.fill(0);
  const SCALE = st.tsize, GAP = SCALE, ADV = 5 * SCALE + GAP, text = st.text;
  if (!text.length) { sampleCanvas(0); return; }
  const total = text.length * ADV + CW;
  const offset = Math.floor(t * (10 + st.speed) / 400) % total;
  const y0 = st.ty;
  for (let ci = 0; ci < text.length; ci++) {
    const x0 = CW + ci * ADV - offset;
    if (x0 + 5 * SCALE < 0 || x0 >= CW) continue;
    let ch = text.charCodeAt(ci);
    if (ch < 32 || ch > 90) ch = 63;
    const glyph = FONT5X7[ch - 32];
    for (let gx = 0; gx < 5; gx++) for (let gy = 0; gy < 7; gy++) if (glyph[gx] & (1 << gy))
      for (let dx = 0; dx < SCALE; dx++) for (let dy = 0; dy < SCALE; dy++) canvasSet(x0 + gx * SCALE + dx, y0 + gy * SCALE + dy, 255);
  }
  sampleCanvas(SCALE >= 3 ? 0 : 1);
}
let lastSim = performance.now();
function simulate() {
  const now = performance.now(), dt = now - lastSim, t = animTime();
  lastSim = now;
  switch (st.mode) {
    case 'neurons': renderNeurons(dt); break;
    case 'pulse': renderPulseMode(t); break;
    case 'text': renderText(t); break;
    case 'remote': frame.set(painted); break;
  }
  renderWaves();
}

// Gleiche Umlaut-Ersetzung wie setText() in der Firmware
const normalizeText = s => s.toUpperCase().replace(/Ä/g, 'A').replace(/Ö/g, 'O').replace(/Ü/g, 'U').replace(/ß/gi, 'SS').replace(/[^\x20-\x5A]/g, '?').slice(0, 63);

// --- Zeichnen: Platine 1:1 aus led_map.js -------------------------------------
const cv = $('brain'), ctx = cv.getContext('2d');
cv.height = Math.round(cv.width / BOARD_ASPECT);
const PAD = 10;
const sx = v => PAD + v / 255 * (cv.width - 2 * PAD);
const sy = v => PAD + v / 255 * (cv.height - 2 * PAD);
const mm = cv.width / 100; // Pixel pro Millimeter (Platine ist ~100 mm breit)

const boardPath = new Path2D();
for (const poly of BOARD_OUTLINE) {
  boardPath.moveTo(sx(poly[0]), sy(poly[1]));
  for (let i = 2; i < poly.length; i += 2) boardPath.lineTo(sx(poly[i]), sy(poly[i + 1]));
  boardPath.closePath();
}

function draw() {
  ctx.clearRect(0, 0, cv.width, cv.height);
  ctx.fillStyle = '#f0c010';
  ctx.fill(boardPath);
  ctx.strokeStyle = '#8a6d00';
  ctx.lineWidth = 1.5;
  ctx.stroke(boardPath);
  ctx.fillStyle = '#1a1a14';
  for (const [x, y, r] of BOARD_HOLES) { ctx.beginPath(); ctx.arc(sx(x), sy(y), r / 255 * (cv.width - 2 * PAD), 0, 7); ctx.fill(); }
  const brightScale = connected ? 1 : st.bright / 15;
  for (let i = 0; i < N; i++) {
    const v = frame[i] / 255 * brightScale, x = sx(LED_XY[i][0]), y = sy(LED_XY[i][1]);
    if (v > 0.02) {
      const g = ctx.createRadialGradient(x, y, 0, x, y, 3.5 * mm);
      g.addColorStop(0, `rgba(255,255,240,${v})`);
      g.addColorStop(0.3, `rgba(255,250,200,${v * 0.6})`);
      g.addColorStop(1, 'rgba(255,240,180,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(x, y, 3.5 * mm, 0, 7); ctx.fill();
    }
    ctx.fillStyle = v > 0.02 ? '#fffdf0' : '#c9a200';
    ctx.fillRect(x - 0.35 * mm, y - 0.2 * mm, 0.7 * mm, 0.4 * mm); // XL-0201: 0,7 x 0,4 mm
  }
}

function tick() {
  if (!connected) simulate();
  draw();
  requestAnimationFrame(tick);
}

// --- BLE -----------------------------------------------------------------------
async function connect() {
  try {
    device = await navigator.bluetooth.requestDevice({ filters: [{ namePrefix: 'Schwammhirn' }], optionalServices: [SERVICE] });
    device.addEventListener('gattserverdisconnected', onDisconnected);
    const server = await device.gatt.connect();
    const svc = await server.getPrimaryService(SERVICE);
    rx = await svc.getCharacteristic(RX);
    const tx = await svc.getCharacteristic(TX);
    tx.addEventListener('characteristicvaluechanged', e => onNotify(new TextDecoder().decode(e.target.value)));
    await tx.startNotifications();
    setConnected(true);
    log('verbunden mit ' + device.name);
    await send('mirror on');
    await send('status');
  } catch (e) { log('Fehler: ' + e.message); }
}
function onDisconnected() { rx = null; setConnected(false); log('getrennt'); }
function setConnected(on) {
  connected = on;
  $('state').textContent = on ? 'verbunden' : 'Simulation';
  $('connect').textContent = on ? 'Trennen' : 'Mit Badge verbinden';
  $('status').disabled = !on;
  if (!on) $('peers').textContent = '';
}
let queue = Promise.resolve();
function send(cmd) {
  if (!rx) return Promise.resolve();
  queue = queue.then(() => rx.writeValueWithResponse(new TextEncoder().encode(cmd))).catch(e => log('Senden fehlgeschlagen: ' + e.message));
  return queue;
}
function onNotify(s) {
  if (s[0] === 'F' && s.length === 1 + N * 2) {
    if (st.mode === 'remote') return;
    for (let i = 0; i < N; i++) frame[i] = parseInt(s.substr(1 + 2 * i, 2), 16);
    return;
  }
  log('< ' + s);
  const m = s.match(/mode=(\w+) speed=(\d+) bright=(\d+) tsize=(\d+) ty=(\d+) text=(.*) sync=(\w+) gen=\d+ id=\w+ peers=(\d+)/);
  if (m) {
    applyMode(m[1]);
    for (const [id, v] of [['speed', m[2]], ['bright', m[3]], ['tsize', m[4]], ['ty', m[5]]]) {
      st[id] = +v; $(id).value = v; $(id + 'Val').textContent = v;
    }
    st.text = m[6]; $('text').value = m[6];
    $('sync').checked = m[7] === 'on';
    $('peers').textContent = m[8] + ' Badge(s) in Reichweite';
  }
  const mm = s.match(/^(?:ok|button:) mode (\w+)/);
  if (mm) applyMode(mm[1]);
  if (/^ok text/.test(s)) applyMode('text');
}

// --- Bedienung ---------------------------------------------------------------------
function applyMode(m) {
  st.mode = m;
  for (const b of $('modes').children) b.classList.toggle('active', b.dataset.mode === m);
  const paint = m === 'remote';
  $('clear').hidden = $('invert').hidden = !paint;
  $('canvasHint').textContent = paint ? 'LEDs antippen oder ziehen zum Malen.' : (connected ? 'Live-Bild des Badges.' : 'Simulation. So sieht es auf dem Badge aus.');
  if (paint) frame.set(painted);
}
let frameTimer = null;
function sendFrame() {
  frame.set(painted);
  if (!rx || frameTimer) return;
  frameTimer = setTimeout(() => {
    frameTimer = null;
    send('frame ' + Array.from(painted, b => b.toString(16).padStart(2, '0')).join(''));
  }, 80);
}
function ledAt(e) {
  const r = cv.getBoundingClientRect();
  const x = (e.clientX - r.left) * cv.width / r.width, y = (e.clientY - r.top) * cv.height / r.height;
  let best = -1, bd = (4 * mm) ** 2;
  for (let i = 0; i < N; i++) {
    const d = (sx(LED_XY[i][0]) - x) ** 2 + (sy(LED_XY[i][1]) - y) ** 2;
    if (d < bd) { bd = d; best = i; }
  }
  return best;
}
cv.addEventListener('pointerdown', e => {
  if (st.mode !== 'remote') { const i = ledAt(e); if (i >= 0) { triggerWave(i); send('pulse ' + i); } return; }
  const i = ledAt(e);
  painting = i >= 0 && painted[i] ? 'erase' : 'paint';
  if (i >= 0) { painted[i] = painting === 'erase' ? 0 : 255; sendFrame(); }
});
cv.addEventListener('pointermove', e => {
  if (!painting || st.mode !== 'remote') return;
  const i = ledAt(e);
  if (i >= 0) { painted[i] = painting === 'erase' ? 0 : 255; sendFrame(); }
});
addEventListener('pointerup', () => painting = false);
$('clear').onclick = () => { painted.fill(0); sendFrame(); };
$('invert').onclick = () => { painted = painted.map(v => 255 - v); sendFrame(); };

$('connect').onclick = () => device?.gatt.connected ? device.gatt.disconnect() : connect();
$('pulse').onclick = () => { const o = (Math.random() * N) | 0; triggerWave(o); send('pulse ' + o); };
$('status').onclick = () => send('status');
$('sendText').onclick = () => { st.text = normalizeText($('text').value); $('text').value = st.text; applyMode('text'); send('text ' + st.text); };
$('text').addEventListener('keydown', e => { if (e.key === 'Enter') $('sendText').click(); });
$('text').addEventListener('input', () => { if (!connected) { st.text = normalizeText($('text').value); if (st.mode !== 'text') applyMode('text'); } });
for (const b of $('modes').children) b.onclick = () => { applyMode(b.dataset.mode); send('mode ' + b.dataset.mode); if (b.dataset.mode === 'remote') sendFrame(); };
const sliderTimer = {};
for (const id of ['speed', 'bright', 'tsize', 'ty']) {
  $(id).oninput = () => {
    st[id] = +$(id).value;
    $(id + 'Val').textContent = $(id).value;
    if ((id === 'tsize' || id === 'ty') && st.mode !== 'text') applyMode('text');
    clearTimeout(sliderTimer[id]);
    sliderTimer[id] = setTimeout(() => send(id + ' ' + $(id).value), 150);
  };
}
$('sync').onchange = () => send('sync ' + ($('sync').checked ? 'on' : 'off'));

if (!navigator.bluetooth) log('Dieser Browser kann kein Web Bluetooth. Die Simulation läuft trotzdem. Zum Verbinden Chrome/Edge auf Android oder Desktop nutzen, auf iPhone „Bluefy“.');
applyMode('neurons');
tick();
</script>
</body>
</html>
